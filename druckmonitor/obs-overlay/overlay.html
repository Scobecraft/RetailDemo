<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Druck-Übersicht Overlay</title>
<!--
  OBS-Overlay 1920x1080 – Darkmode mit orangen Akzenten
  =====================================================
  OBS: Quelle "Browser" -> "Lokale Datei" = diese Datei, Breite 1920, Höhe 1080.
  Diese Quelle GANZ OBEN in der Szene platzieren – die Fenster für Kamera und Webseite sind transparent.
  Darunter die Quellen exakt so platzieren (Rechtsklick > Transformieren > Transformation bearbeiten):

    Druckstream (4:3):  Position X 24   Y 120   Größe 1184 x 888
    Webseite:           Position X 1232 Y 120   Größe  664 x 888
                        (Browserquelle direkt mit Breite 664 / Höhe 888 anlegen)

  Tipp: overlay.html?vorschau zeigt Platzhalter in den Fenstern (zum Testen im Browser).
  Logo ist direkt in diese Datei eingebettet – keine weiteren Dateien nötig.
-->
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --line: #262a31;
    --text: #e9eaee;
    --muted: #8b909b;
    --orange: #ff7a00;
    --orange-soft: rgba(255, 122, 0, .16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: transparent;               /* Seite selbst ist durchsichtig */
    color: var(--text);
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
  }
  /* Hintergrundfläche mit zwei ausgestanzten (transparenten) Fenstern */
  .bg {
    position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1200px 600px at 0% 0%, rgba(255,122,0,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(255,122,0,.05), transparent 60%),
      var(--bg);
    /* Loch 1: Kamera 24/120 1184x888 – Loch 2: Webseite 1232/120 664x888 */
    -webkit-mask:
      linear-gradient(#000 0 0) 24px 120px / 1184px 888px no-repeat,
      linear-gradient(#000 0 0) 1232px 120px / 664px 888px no-repeat,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  /* ---------- Kopfzeile ---------- */
  header {
    position: absolute; left: 24px; top: 16px; width: 1872px; height: 80px;
    display: flex; align-items: center; gap: 24px;
    padding: 0 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  header::after { /* oranger Akzentstreifen */
    content: ""; position: absolute; left: 28px; right: 28px; bottom: -1px; height: 3px;
    background: linear-gradient(90deg, var(--orange), rgba(255,122,0,0) 70%);
    border-radius: 3px;
  }
  .logo { height: 52px; display: flex; align-items: center; }
  .logo img { height: 52px; width: auto; display: block; }
  .logo .fallback { display: none; font-size: 30px; font-weight: 800; letter-spacing: .5px; }
  .logo .fallback b { color: var(--orange); }
  .divider { width: 1px; height: 40px; background: var(--line); }
  .title { font-size: 26px; font-weight: 600; }
  .title small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .spacer { flex: 1; }
  .live {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 999px;
    background: var(--orange-soft); color: var(--orange);
    font-weight: 700; font-size: 16px; letter-spacing: 2px;
  }
  .live i {
    width: 10px; height: 10px; border-radius: 50%; background: var(--orange);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,122,0,.6);} 50% { opacity: .5; box-shadow: 0 0 0 6px rgba(255,122,0,0);} }
  .clock { text-align: right; font-variant-numeric: tabular-nums; }
  .clock .t { font-size: 28px; font-weight: 600; }
  .clock .d { font-size: 14px; color: var(--muted); }

  /* ---------- Rahmen für die Quellen ---------- */
  .frame {
    position: absolute; top: 120px; height: 888px;
    border-radius: 6px;
    background: transparent;               /* hier scheint Kamera / Webseite durch */
    outline: 2px solid var(--line);
    outline-offset: 4px;
  }
  .frame.print { left: 24px;   width: 1184px; outline-color: var(--orange); }
  .frame.web   { left: 1232px; width: 664px; }
  .frame .ph {   /* Platzhaltertext – nur mit ?vorschau in der URL sichtbar */
    position: absolute; inset: 0; display: none; place-items: center;
    background: #000;
    color: #2c3038; font-size: 22px; font-weight: 600; letter-spacing: 1px;
  }
  /* Eck-Akzente */
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 28px; height: 28px;
    border: 4px solid var(--orange); z-index: 2; pointer-events: none;
  }
  .frame::before { left: -8px; top: -8px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .frame::after  { right: -8px; bottom: -8px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

  body.preview .frame .ph { display: grid; }

  /* ---------- Fußzeile ---------- */
  footer {
    position: absolute; left: 24px; top: 1028px; width: 1872px; height: 36px;
    display: flex; align-items: center; gap: 14px;
    font-size: 15px; color: var(--muted);
  }
  footer .tag {
    color: var(--bg); background: var(--orange);
    padding: 3px 10px; border-radius: 6px; font-weight: 700; font-size: 13px; letter-spacing: 1px;
  }
  footer .r { margin-left: auto; }
  footer .sep { color: var(--line); }

  /* ================= ANIMATIONEN ================= */
  /* wandernder Hintergrund-Glow */
  .bg::before {
    content: ""; position: absolute; inset: -20%;
    background: radial-gradient(600px 400px at 50% 50%, rgba(255,122,0,.08), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate; pointer-events: none;
  }
  @keyframes drift { 0% { transform: translate(-30%, -20%);} 50% { transform: translate(25%, 10%);} 100% { transform: translate(-10%, 25%);} }

  /* Einblenden beim Laden */
  header { animation: slideDown .9s cubic-bezier(.2,.8,.2,1) both; }
  .frame.print { animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both; }
  .frame.web   { animation: rise .9s .45s cubic-bezier(.2,.8,.2,1) both; }
  footer { animation: fade 1s .7s both; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-30px);} to { opacity: 1; transform: none;} }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.98);} to { opacity: 1; transform: none;} }
  @keyframes fade { from { opacity: 0;} to { opacity: 1;} }

  /* Lichtschimmer über der Akzentlinie */
  header::after {
    background: linear-gradient(90deg, var(--orange), rgba(255,122,0,.15) 55%, var(--orange) 60%, rgba(255,122,0,0) 75%);
    background-size: 250% 100%;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { from { background-position: 100% 0;} to { background-position: -150% 0;} }

  /* umlaufender Glow-Rahmen um den Druckstream */
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .glow {
    position: absolute; left: 14px; top: 110px; width: 1204px; height: 908px;
    border-radius: 12px; padding: 3px; pointer-events: none;
    background: conic-gradient(from var(--a), transparent 0 60%, var(--orange) 80%, #ffb366 85%, transparent 92%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 8px rgba(255,122,0,.7));
    animation: spin 6s linear infinite, fade 1s .9s both;
  }
  @keyframes spin { to { --a: 360deg; } }
  .frame.print { outline-color: rgba(255,122,0,.35); }

  /* Eck-Akzente atmen */
  .frame::before, .frame::after { animation: corner 3s ease-in-out infinite; }
  @keyframes corner { 50% { filter: drop-shadow(0 0 6px var(--orange)); } }

  /* Lauftext Fußzeile */
  .ticker { flex: 1; overflow: hidden; white-space: nowrap;
    -webkit-mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .ticker span { display: inline-block; padding-left: 100%; animation: ticker 35s linear infinite; }
  @keyframes ticker { to { transform: translateX(-100%); } }
</style>
</head>
