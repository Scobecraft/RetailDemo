<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Specs</title>
<style>
  :root { --accent: #ff8a00; --accent-2: #ffb347; --ease: cubic-bezier(.2, .8, .2, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; color: #f4f6fb; }

  /* Zugeklappt: Lasche am rechten Rand */
  #tab { position: absolute; right: 0; top: 0; width: 52px; height: 168px; border: 0; padding: 0; cursor: pointer; color: #fff;
    border-radius: 16px 0 0 16px; background: linear-gradient(160deg, #ff9a1f, #ff5e3a); box-shadow: -4px 6px 20px rgba(0,0,0,.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: transform .25s var(--ease), opacity .2s; }
  #tab:hover { transform: translateX(-4px); }
  #tab svg { width: 24px; height: 24px; }
  #tab span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; letter-spacing: .18em; font-size: 13px; text-transform: uppercase; }
  #tab::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 rgba(255,138,0,.6); animation: ping 3s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,138,0,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(255,138,0,0); } }
  body.open #tab { opacity: 0; pointer-events: none; }

  /* Aufgeklappt: Datenblatt */
  #sheet { position: absolute; inset: 0 0 0 0; border-radius: 22px 0 0 22px; overflow: hidden; display: flex; flex-direction: column;
    background: rgba(14,17,25,.94); border: 1px solid rgba(255,255,255,.1); border-right: 0; box-shadow: -10px 0 40px rgba(0,0,0,.35);
    transform: translateX(105%); transition: transform .28s var(--ease); }
  body.open #sheet { transform: none; }
  #sheet::before { content: ""; position: absolute; width: 360px; height: 360px; right: -140px; top: -160px; border-radius: 50%; background: var(--accent); filter: blur(90px); opacity: .45; }
  header { position: relative; display: flex; align-items: center; gap: 12px; padding: 18px 18px 0 22px; min-height: 64px; }
  header img { max-height: 42px; max-width: 220px; object-fit: contain; }
  header .store { font-weight: 700; font-size: 16px; }
  header .sp { flex: 1; }
  #close { border: 0; background: rgba(255,255,255,.1); color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  #close:hover { background: rgba(255,255,255,.2); }
  .body { position: relative; flex: 1; overflow-y: auto; padding: 14px 22px 22px; }
  .eyebrow { color: var(--accent-2); text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 700; }
  h1 { margin: 4px 0 16px; font-size: 28px; line-height: 1.1; font-weight: 800; }
  .price { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px; border-radius: 14px; margin-bottom: 14px;
    background: linear-gradient(135deg, var(--accent), #ff5e3a); }
  .price small { text-transform: uppercase; letter-spacing: .15em; font-size: 11px; font-weight: 700; opacity: .9; }
  .price strong { font-size: 26px; font-weight: 800; }
  .row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08);
    opacity: 0; transform: translateX(16px); }
  body.open .row { animation: in .45s var(--ease) forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .row .ic { flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,138,0,.16); color: var(--accent-2); }
  .row .ic svg { width: 21px; height: 21px; }
  .row .lb { color: #a3acc2; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .row .vl { font-size: 15px; font-weight: 600; margin-top: 1px; }
  footer { position: relative; padding: 14px 22px 20px; }
  #play { width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.1); display: flex; gap: 10px; align-items: center; justify-content: center; }
  #play:hover { background: rgba(255,255,255,.18); }
  #play svg { width: 18px; height: 18px; }
  .help { color: #8790a6; font-size: 12px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <button id="tab" title="Technische Daten anzeigen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.8"/><path d="M2 19h20"/></svg>
    <span>Specs</span>
  </button>

  <aside id="sheet">
    <header><div id="brand"></div><div class="sp"></div><button id="close" title="Schließen">✕</button></header>
    <div class="body" id="content"></div>
    <footer>
      <button id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>Präsentation ansehen</button>
      <div class="help">Fragen? Unser Team berät dich gern.</div>
    </footer>
  </aside>

<script src="icons.js"></script>
<script src="panel.js"></script>
</body>
</html>
