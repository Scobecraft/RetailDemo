<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>PIN eingeben</title>
<style>
  :root { --accent: #ee7f00; --bg: #f5f6f8; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb; --danger: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1e25; --text: #e8eaf0; --muted: #9aa1ae; --line: #2c313b; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; }
  form { width: 280px; text-align: center; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 10px; font-size: 22px; letter-spacing: .4em; text-align: center; background: transparent; color: inherit; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { margin-top: 12px; width: 100%; border: 0; border-radius: 10px; padding: 11px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: var(--danger); min-height: 20px; margin-top: 8px; }
</style>
</head>
<body>
  <form id="f">
    <h1>Mitarbeiter-Bereich</h1>
    <p>Bitte PIN eingeben</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" autofocus>
    <button type="submit">Weiter</button>
    <div class="err" id="err"></div>
  </form>
<script src="pin.js"></script>
</body>
</html>
