<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Retail Demo</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Bewegter Hintergrund -->
  <div class="bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div>
    <div class="sweep"></div>
  </div>

  <canvas id="fxBack"></canvas>
  <div id="stage"></div>
  <canvas id="fxFront"></canvas>
  <div id="garland" hidden></div>
  <div class="ribbon" id="ribbon" hidden><span></span></div>

  <!-- Kennzeichnung: von der Demo erzeugte Szenen (nicht bei eigenen Videos/Bildern) -->
  <div class="ai-note" id="aiNote" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z" opacity=".7"/></svg>
    <span>Inhalt KI-generiert</span>
  </div>

  <!-- Hinweis zum Ausprobieren, auf allen Szenen -->
  <div class="hint" id="hint">
    <span class="mouse"><span class="wheel"></span></span>
    <span><strong>Probier mich aus!</strong> Einfach Maus bewegen oder eine Taste drücken</span>
  </div>
  <div class="progress"><div id="progress"></div></div>

  <script src="icons.js"></script>
  <script src="themes.js"></script>
  <script src="demo.js"></script>
</body>
</html>
