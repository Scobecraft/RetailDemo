<!doctype html>
<html lang="de">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Retail Demo</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Bewegter Hintergrund -->
  <div class="bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div>
    <div class="sweep"></div>

  <script src="icons.js"></script>
  <script src="demo.js"></script>
