services:
  demo-server:
    build: .
    container_name: retail-demo-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/data
      # Auslastung des Proxmox-Containers für die Übersicht (nur lesend)
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/stat:/host/proc/stat:ro
      - /proc/uptime:/host/proc/uptime:ro
