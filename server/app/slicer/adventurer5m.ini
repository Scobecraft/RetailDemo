# Flashforge Adventurer 5M / 5M Pro – 0,4-mm-Düse (Grundprofil für PrusaSlicer-CLI)
# Druckbett 220 × 220 × 220 mm, Nullpunkt in der Mitte (wie im OrcaSlicer-Profil des Herstellers).
# Material, Qualität, Füllung, Stützen und Rand setzt der Server pro Druckauftrag.

printer_technology = FFF
gcode_flavor = klipper
bed_shape = -110x-110,110x-110,110x110,-110x110
max_print_height = 220
nozzle_diameter = 0.4
filament_diameter = 1.75
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 0
z_offset = 0
min_layer_height = 0.08
max_layer_height = 0.32
thumbnails =
gcode_label_objects = firmware
gcode_comments = 0

# Geschwindigkeiten bewusst moderat (zuverlässig statt rekordschnell)
perimeter_speed = 150
external_perimeter_speed = 100
infill_speed = 200
solid_infill_speed = 150
top_solid_infill_speed = 100
support_material_speed = 120
bridge_speed = 50
gap_fill_speed = 80
travel_speed = 300
first_layer_speed = 40
first_layer_speed_over_raft = 40
default_acceleration = 5000
perimeter_acceleration = 3000
infill_acceleration = 5000
bridge_acceleration = 2000
first_layer_acceleration = 1000
travel_acceleration = 6000
