min_print_speed = 15

start_gcode = ; Druckbett und Düse vorheizen, referenzieren, warten\nM140 S[first_layer_bed_temperature]\nM104 S150\nG90\nM83\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\n; Reinigungslinie am vorderen Rand\nG1 Z5 F6000\nG1 X-100 Y-106 F6000\nG1 Z0.3 F1200\nG1 X0 E10 F1500\nG1 X60 E4 F1500\nG1 Z2 F1200
end_gcode = ; Ende: zurückziehen, Kopf hoch, alles aus\nG1 E-2 F2400\nG91\nG1 Z10 F600\nG90\nG1 X0 Y100 F6000\nM104 S0\nM140 S0\nM106 S0\nM84
before_layer_gcode = ;Z:[layer_z]
